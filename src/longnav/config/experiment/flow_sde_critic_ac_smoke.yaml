# @package _global_
# 1-GPU smoke of the actor-critic config; 3 cycles. NOT an experiment.
# ACTOR-CRITIC, the standard design (user-specified 2026-08-19):
#   - warm start: cotrain-v4 ck-1000 (value-SFT base), merged; fresh RL adapter.
#   - critic: TRAINABLE distributional value head, in-loop, Monte Carlo return
#     targets with the same HL-Gauss CE it was trained with during SFT
#     (rl_loss's distributional_loss branch). Warm-started from the fresh-slice
#     offline fit (refit_value_head_fresh300.pt, inner-val corr 0.439) -- that
#     offline fit was WARMUP ONLY and never recurs; the head tracks the policy
#     by training in the loop from cycle 0.
#   - baseline: DIRECT critic baseline from cycle 0 (reinforce_plus_plus_state_critic,
#     A = G - V). No kernel anywhere in this run, ever. Distributional TD is a
#     possible future upgrade; not built.
#   - PROBE COUNTERFACTUAL logs critic-vs-fitted-kernel-vs-naive per cycle as pure
#     observation (the kernel there is a counterfactual gauge, not a baseline).
# Fresh run, fresh buffer, single condition end to end. Previous run
# (flow_sde_critic097_warm64) abandoned as a three-condition patchwork; its
# artifacts remain on disk for reference only.

defaults:
  - override /policy_head@vlm.policy_head: flow_sde_head
  - override /sim: objectnav_continuous

vlm:
  attn_impl: flash_attention_2
  save_outputs: true
  merge_adapter_dir: /Projects/spatial_training/dump/pose_injection/run_cotrain_v4_probe_mix/checkpoint-1000_RLCOMPOSED/adapter
  policy_head:
    checkpoint_dir: /Projects/spatial_training/dump/pose_injection/run_cotrain_v4_probe_mix/checkpoint-1000_RLCOMPOSED
    gap: 10
    sde_n: 3
    sde_noise_a: 0.9
    sde_position_weight: sigma

sim:
  episodes: /Projects/spatial_training/data/datasets/objectnav/hm3d/v1_train100x80
  exclude_categories: [plant]
  train_uids: /Projects/spatial_training/dump/eval_system/episode_sets/probe_mini8.txt
  scene_root: /Projects/spatial_training/data/scene_datasets
  gap: 10
  dt: 0.04
  max_steps: 175
  success_distance: 0.4
  success_reward: 0.0
  escape_penalty: 2.5
  navmesh: dataset
  minimal_logging: false
  reward_lost_steps: 25

rollout:
  max_steps: 175
  convo_start_template:
    - role: user
      content:
        - type: text
          text: "You are a robot navigating an indoor environment toward a goal object.\nGoal: $instr_or_goal\nAt each step you receive the current RGB observation. Produce the next short trajectory of poses to follow, relative to your current pose."
    - role: user
      content:
        - { type: text, text: "Observation 0:" }
        - { type: image }
        - { type: text, text: "Action:" }
    - role: assistant
      content:
        - { type: text, text: "**____**" }
  convo_turn_template:
    - role: assistant
      content:
        - { type: text, text: "**____**" }
    - role: user
      content:
        - { type: text, text: "Observation $step:" }
        - { type: image }
        - { type: text, text: "Action:" }
    - role: assistant
      content:
        - { type: text, text: "**____**" }

training:
  checkpoint: null
  load_optim: false
  load_sched: false
  learning_rate: 2.0e-6
  action_head_learning_rate: 0.0
  grad_accum_steps: 2
  max_grad_norm: 20.0
  total_optimization_steps: 9
  warmup_steps: 32
  save_step: 8
  rl_config:
    advantage_estimator: reinforce_plus_plus_state_critic
    value_head:
      kind: distributional
      hidden_dims: [1024, 512]
      n_bins: 51
      v_min: -8.0
      v_max: 24.0
      hl_sigma_ratio: 0.75
      dropout: 0.0
      dtype: float32
      readout_offset: -2
      learning_rate: 1.0e-4
      value_grad_scale: 0.1
      cliprange_value: 0.2
      init_weights: /Projects/spatial_training/dump/eval_system/value_offline/refit_value_head_fresh300.pt
    gamma: 0.97
    n_rollout: 6
    n_adv: 48
    entropy_bonus: 0.0
    n_epoch: 1
    token_weighted_loss: true
    bootstrap_truncated: false
    ref_kl: true
    ref_kl_coeff: 0.0

task:
  logger:
    _target_: longnav.utils.logging_workers.WandbLoggerActor
    project: "cont_dev"
  run_name: "flow_sde_critic_ac_SMOKE"
  output_dir: /Projects/spatial_training/dump/flow_rl
  subset_label: "everything"
  shard_size: 0
  eval_every: 0
  eval_set_size: 32
  eval_uids_file: /Projects/spatial_training/dump/eval_system/episode_sets/fullpool_evalset_servable26.txt
  eval_ode: true

resources:
  num_vlms: 1
  num_sims: 1
  vlm_gpu_fraction: 0.45
  sim_gpu_fraction: 0.15
  vlm_conda_env: longnav_vlm
