# @package _global_
# C: no binary state probe.  The first 30 chunks always execute, then a decoded chunk is
# STOP only when both cumulative translation and cumulative yaw are near zero.
defaults:
  - hm3d_stop_rl_stopstudy_common

rollout:
  stop_execution_mode: trajectory_length
  trajectory_stop_threshold_m: 0.10
  trajectory_stop_yaw_threshold_rad: 0.10
  trajectory_stop_min_steps: 30

training:
  rl_config:
    state_probe: null
    state_probe_trainable: false

task:
  run_name: hm3d_stopstudy_c_path_010_sft_r2
