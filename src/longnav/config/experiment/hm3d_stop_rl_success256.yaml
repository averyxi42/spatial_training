# @package _global_
defaults:
  - hm3d_stop_rl_hardstop256

rollout:
  stop_execution_mode: categorical
  stop_prob_threshold: 0.5
  stop_execution_min_steps: 0

training:
  action_head_learning_rate: 1.0e-5
  state_probe_learning_rate: 1.0e-5
  rl_config:
    state_probe_bce_weight: 0.0
    state_probe_balanced_bce: false
    state_probe_ref_kl_coeff: 0.1
    state_probe_firstpass_weight: 0.0
    state_probe_shadow_rl_weight: 0.0
    state_probe_threshold_margin_weight: 0.0
    stop_behavior_seam_limit: 0.05

task:
  run_name: success256
  logger:
    group: hm3dpe_success256_r1
