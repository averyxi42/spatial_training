# @package _global_
# All formal stop-study experiments initialize solely from the shared v12 SFT checkpoint
# inherited through hm3d_stop_rl_exploration.  Prior RL checkpoints are diagnostics only.
defaults:
  - hm3d_stop_rl_exploration

sim:
  post_goal_steps: 4
  policy_stop_correct_reward: 1.0
  policy_stop_false_penalty: 1.0

training:
  checkpoint: null
  load_optim: false
  load_sched: false
  resume_driver_state: false
  learning_rate: 1.0e-6
  max_grad_norm: 10.0
  # With 2 rollout episodes and grad_accum=4, this is 360 driver cycles.
  total_optimization_steps: 180
  warmup_steps: 16
  save_step: 20
  rl_config:
    advantage_estimator: reinforce_plus_plus_time_kernel
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    policy_loss:
      name: clip_cov
      clip_cov_ratio: 0.0002
      clip_cov_ub: 5.0
      clip_cov_lb: 1.0
    time_kernel_sigma: 40.0
    ref_kl_coeff: 0.001
    max_ref_log_ratio_p95: 8.0
    n_rollout: 2
    n_adv: 32
    n_epoch: 1

task:
  output_dir: /home/ubuntu/storage-migrations/20260906-longnav/v12-regeneration/production/rl_stop_experiments/stop_head_rl_20260913
  eval_every: 8
  eval_set_size: 32
  save_eval_bests: true
