# @package _global_
defaults:
  - hm3d_stop_rl_stopstudy_b_efficiency

# The sampled STOP-versus-CONTINUE action receives a PPO loss and is the actual
# absorbing actuator during training and native evaluation.
rollout:
  stop_execution_mode: categorical
  stop_prob_threshold: null
  stop_execution_min_steps: 30
  categorical_stop_action_consistency_penalty: 0.25
  categorical_stop_action_consistency_translation_m: 0.1
  categorical_stop_action_consistency_yaw_rad: 0.1

training:
  rl_config:
    state_probe_shadow_rl_weight: 0.0
    state_probe_firstpass_weight: 0.0

task:
  run_name: hm3d_stopstudy_b_categorical_sft_r1
