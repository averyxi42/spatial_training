# @package _global_
# D: strict near-zero motion needs no initial guard on the measured SFT distribution.
defaults:
  - hm3d_stop_rl_stopstudy_common

rollout:
  stop_execution_mode: trajectory_length
  trajectory_stop_threshold_m: 0.01
  trajectory_stop_yaw_threshold_rad: 0.01
  trajectory_stop_min_steps: 0

training:
  rl_config:
    state_probe: null
    state_probe_trainable: false

task:
  run_name: hm3d_stopstudy_d_path_001_sft_r2
