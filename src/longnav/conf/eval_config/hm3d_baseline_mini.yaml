# @package _global_
task:
  run_name: override_me
  wandb_project: "rl_eval"
  shard_size: 6
  subset_label: "sample400_a"
  episode_json: ''
  output_dir: ./dump/rl_eval
  jobtype: eval
rollout:
  max_steps: 500
  temperature: 1.0
  action_space_str: '[stop, forward, left, right, up, down]'
  system_prompt: ${read_text:src/longnav/conf/prompts/objectnav_prompt.txt}
  action_space:
  - stop
  - forward
  - left
  - right
vlm:
  model_id: "Qwen/Qwen3-VL-2B-Instruct"
  attn_impl: flash_attention_2
  dtype: bfloat16
  vocab:
  - stop
  - forward
  - left
  - right
  offload_cache: false
  use_sparse: true
  save_outputs: true
sim:
  config_path: habitat_configs/objectnav_hm3d_rgbd_semantic.yaml
  split: val
  fp_guard: false
  fn_guard: false
  ep_seed: 17
training:
  checkpoint: null