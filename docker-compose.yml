# Usage:
#   bash docker/setup_env.sh      # once: writes .env with your uid/gid
#   docker compose build          # ~40-60 min, mostly the habitat-sim build
#   docker compose run --rm longnav                        # shell in `longnav` env
#   docker compose run --rm -e LONGNAV_ENV=vln longnav bash  # shell in `vln` env
#   docker compose run --rm longnav python tests/eval_smoke.py
#
# Set LONGNAV_DATA in .env to point at datasets living outside the repo.
services:
  longnav:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: longnav:dev

    # The image bakes in no uid, so switching users is a restart, not a rebuild.
    # Populated by docker/setup_env.sh — do NOT change these to ${UID}/${GID},
    # which bash does not export (UID) or define at all (GID), and which would
    # silently pin every user to 1000:1000.
    user: "${LONGNAV_UID:-1000}:${LONGNAV_GID:-1000}"

    stdin_open: true
    tty: true
    # Ray's object store and habitat's workers need far more than the 64MB default.
    shm_size: "16gb"
    ipc: host
    # Ray spawns thousands of processes and file descriptors; the docker
    # defaults make the raylet die under load.
    pids_limit: -1
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 65536
        hard: 65536
    # Uncomment for multi-node Ray or if the dashboard/metrics agent can't
    # connect through docker's NAT. Note it disables port isolation.
    # network_mode: host
    volumes:
      - ./:/workspace
      - ${LONGNAV_DATA:-./data}:/workspace/data
      # HF/torch caches and bash history (HISTFILE points here) survive --rm.
      - longnav-cache:/home/longnav/.cache
      # The conda envs, so `docker/install.sh` survives container recreation.
      # Docker seeds an empty named volume from the image on first start, so the
      # habitat-sim build baked into the image lands here once (~15 GB copy,
      # a minute or two) and is reused from then on.
      #
      # Consequence worth knowing: this volume now SHADOWS the image's envs. After
      # rebuilding the image (new HABITAT_VERSION, new python, ...) the volume
      # still holds the old envs, and the rebuild appears to do nothing. Reset it
      # with `docker compose down -v` — which also clears longnav-cache — or
      # `docker volume rm <project>_longnav-conda-envs` to drop just this one.
      - longnav-conda-envs:/opt/conda/envs
    environment:
      - WANDB_API_KEY
      - HF_TOKEN
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # Which conda env the shell lands in. Ray reaches the other one by name.
      - LONGNAV_ENV=${LONGNAV_ENV:-longnav}
      # Consumed by docker/install.sh; set to 1 to add flash-attn to the VLM env.
      - INSTALL_FLASH_ATTN=${INSTALL_FLASH_ATTN:-0}
      # Keep BLAS from oversubscribing cores across many Ray workers.
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  longnav-cache:
  longnav-conda-envs:
